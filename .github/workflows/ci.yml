name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pandas>=2.2,<4" "numpy>=1.26,<3" "pytest>=8"
      # fixture and committed-aggregate tests only; no downloads or model fits
      - run: pytest -q
